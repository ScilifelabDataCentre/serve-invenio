apiVersion: v2
name: serve-invenio
appVersion: 12.0.10
description: Serve Invenio deployment chart and values for Argo CD.
home: https://inveniosoftware.org/
icon: https://inveniosoftware.org/static/img/logo-invenio-white.svg
sources:
  - https://github.com/inveniosoftware/invenio-app-rdm
  - https://github.com/inveniosoftware/helm-invenio
  - https://github.com/ScilifelabDataCentre/serve-invenio
keywords:
  - digital-repository
  - institutional-repository
  - multimedia-library
  - multimedia-repository
type: application
version: 1.1.0
annotations:
  artifacthub.io/license: MIT
maintainers:
  - name: Team Whale
    email: serve@scilifelab.se
dependencies:
  - name: opensearch
    condition: opensearch.enabled
    repository: "oci://registry-1.docker.io/bitnamicharts"
    version: "1.4.0"
  - name: postgresql
    condition: postgresql.enabled
    repository: "oci://registry-1.docker.io/bitnamicharts"
    version: "14.3.3"
  - name: rabbitmq
    condition: rabbitmq.enabled
    repository: "oci://registry-1.docker.io/bitnamicharts"
    version: "12.9.3"
  - name: redis
    condition: redis.enabled
    repository: "oci://registry-1.docker.io/bitnamicharts"
    version: "18.12.0"
