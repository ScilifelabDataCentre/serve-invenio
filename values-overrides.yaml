fullnameOverride: "invenio"

global:
  timezone: "Europe/Stockholm"

image:
  registry: "ghcr.io"
  repository: "scilifelabdatacentre/serve-inveniordm"
  tag: "260128-1120"
  pullPolicy: IfNotPresent

invenio:
  hostname: "invenio.serve-dev.scilifelab.se"
  existingSecret: "invenio-bitwarden-secrets"
  init: false
  upgradeInit: false
  demo_data: false
  defaultUsers:
    enabled: true
    existingSecret: "invenio-bitwarden-secrets"
  extraConfig:
    INVENIO_APP_ALLOWED_HOSTS: '["{{ .Values.invenio.hostname }}", "invenio-web", "invenio-web.{{ .Release.Namespace }}.svc.cluster.local"]'
    INVENIO_TRUSTED_HOSTS: '["{{ .Values.invenio.hostname }}", "invenio-web", "invenio-web.{{ .Release.Namespace }}.svc.cluster.local"]'
  datacite:
    enabled: false
    existingSecret: "invenio-bitwarden-secrets"
    secretKeys:
      usernameKey: "DATACITE_USERNAME"
      passwordKey: "DATACITE_PASSWORD"
    prefix: "10.83812"
    testMode: "true"
    format: "{prefix}/SCILIFELAB.{id}"
    landingPageUrl:
      template: "https://{{ .Values.invenio.hostname }}/records/{app_code}/{id}"
      parentTemplate: "https://{{ .Values.invenio.hostname }}/records/{app_code}"

opensearch:
  enabled: true
  fullnameOverride: "invenio-opensearch"
  extraConfig:
    node:
      store:
        allow_mmap: false
  sysctlImage:
    enabled: false

rabbitmq:
  enabled: true
  fullnameOverride: "invenio-rabbitmq"
  auth:
    username: "user"
    existingPasswordSecret: "invenio-bitwarden-secrets"
    existingSecretPasswordKey: "rabbitmq-password"
    existingErlangSecret: "invenio-bitwarden-secrets"
    existingSecretErlangKey: "rabbitmq-erlang-cookie"

postgresql:
  enabled: true
  fullnameOverride: "invenio-postgresql"
  auth:
    username: "invenio"
    database: "invenio"
    existingSecret: "invenio-bitwarden-secrets"
    secretKeys:
      userPasswordKey: "postgres-password"
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    seccompProfile:
      type: "RuntimeDefault"
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: "RuntimeDefault"

flower:
  enabled: true
  existing_secret: true
  secret_name: "invenio-bitwarden-secrets"

web:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  startupProbe:
    exec:
      command:
        - /bin/bash
        - -c
        - "uwsgi_curl -X HEAD -H 'Host: {{ include \"invenio.hostname\" $ }}' $(hostname):5000 /ping"
    initialDelaySeconds: 60
    timeoutSeconds: 10
    periodSeconds: 10
    failureThreshold: 10
  readinessProbe:
    exec:
      command:
        - /bin/bash
        - -c
        - "uwsgi_curl -X HEAD -H 'Host: {{ include \"invenio.hostname\" $ }}' $(hostname):5000 /ping"
    initialDelaySeconds: 30
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 3

worker:
  replicas: 1
  concurrency: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  livenessProbe:
    exec:
      command:
        - /bin/bash
        - -c
        - "celery -A invenio_app.celery inspect ping -d celery@$(hostname)"
    initialDelaySeconds: 120
    timeoutSeconds: 30
    periodSeconds: 30
    failureThreshold: 5

workerBeat:
  livenessProbe:
    exec:
      command:
        - /bin/bash
        - -c
        - "celery -A invenio_app.celery inspect ping"
    initialDelaySeconds: 120
    timeoutSeconds: 30
    periodSeconds: 30
    failureThreshold: 5

persistence:
  enabled: true
  access_mode: ReadWriteMany
  size: 10Gi
  storage_class: "ontap-nas"

ingress:
  enabled: true
  class: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  tlsSecretNameOverride: "invenio-tls"

redis:
  enabled: true
  fullnameOverride: "invenio-redis"
  auth:
    enabled: false
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    seccompProfile:
      type: "RuntimeDefault"
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: "RuntimeDefault"
